<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFMRC Leave Monitoring</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 89 89'><rect width='89' height='89' fill='%235C4AB6'/><rect x='26' y='19' width='7' height='44' fill='%23fff'/><rect x='41' y='11' width='7' height='19' fill='%23fff'/><rect x='41' y='39' width='7' height='41' fill='%23fff'/><rect x='56' y='19' width='7' height='44' fill='%23fff'/></svg>">
<style>
  html, body { margin: 0; height: 100%; background: #5C4AB6; font-family: Roboto, Arial, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
  <!-- TFMRC Leave Monitoring (Google Apps Script web app) shown inside this page -->
  <iframe
    id="app"
    title="TFMRC Leave Monitoring"
    allow="clipboard-write; downloads"></iframe>

  <script>
    var APP_URL = "https://script.google.com/macros/s/AKfycbycKBL8bpBf--sCDVsmG-zqrJw25thqFcmbL4T5pvfl5VSBayD_FKRrIYSgqR2l_RH1/exec";
    // Auto log-in: pass the one-time pass from the TFMRC Portal (?sso=...) to the app,
    // then remove it from the address bar.
    var sso = new URLSearchParams(location.search).get('sso');
    document.getElementById('app').src = APP_URL + (sso ? '?sso=' + encodeURIComponent(sso) : '');
    if (sso && history.replaceState) history.replaceState(null, '', location.pathname);
  </script>

</body>
</html>
